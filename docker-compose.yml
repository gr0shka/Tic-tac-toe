services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - backend-network

  app:
    container_name: go_api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT}:8080"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MIGRATION: true
      APP_HOST: 0.0.0.0
      APP_PORT: ${APP_PORT}
      JWT_SECRET_FILE: /run/secrets/jwt_private_key
      JWT_PUBLIC_FILE: /run/secrets/jwt_public_key
      JWT_ACCESS_TIME: 15m
      JWT_REFRESH_TIME: 720h
    secrets:
      - source: jwt_private_key
      - source: jwt_public_key
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-network

secrets:
  jwt_private_key:
    file: ./secrets/jwt_private.pem
  jwt_public_key:
    file: ./secrets/jwt_public.pem

volumes:
  postgres_data:
    driver: local

networks:
  backend-network:
    driver: bridge