<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-tac-toe API tester</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 760px;
            margin: 24px auto;
            padding: 0 16px;
            background: #f6f8fa;
            color: #222;
        }

        .card {
            background: #fff;
            border: 1px solid #d0d7de;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .field {
            flex: 1;
            min-width: 220px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #57606a;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            font: inherit;
            box-sizing: border-box;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font: inherit;
            cursor: pointer;
            background: #0969da;
            color: white;
        }

        button.secondary { background: #57606a; }
        button.danger { background: #d1242f; }
        button:disabled { opacity: .6; cursor: not-allowed; }

        .status {
            padding: 10px 12px;
            border-radius: 8px;
            background: #f3f4f6;
            margin-top: 12px;
        }

        .meta {
            margin-top: 12px;
            padding: 12px;
            border-radius: 10px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            display: grid;
            gap: 8px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 8px;
            margin-top: 12px;
        }

        .cell {
            width: 100px;
            height: 100px;
            border: 2px solid #d0d7de;
            border-radius: 12px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: 700;
            color: #111;
            line-height: 1;
        }

        .cell:hover:not(:disabled) {
            background: #f0f7ff;
            border-color: #0969da;
        }

        pre {
            margin: 0;
            padding: 12px;
            border-radius: 12px;
            background: #0b1020;
            color: #d6e7ff;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 100px;
        }

        code {
            background: #eef2ff;
            padding: 2px 6px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
<h1>Крестики-нолики — API тестер</h1>

<div class="card">
    <div class="row">
        <div class="field">
            <label for="apiBase">API base URL</label>
            <input id="apiBase" value="http://localhost:8080" />
        </div>
        <div class="field">
            <label for="gameId">Game UUID</label>
            <input id="gameId" placeholder="UUID игры" />
        </div>
    </div>

    <div class="row">
        <button id="createBtn">Create</button>
        <button id="loadBtn" class="secondary">Load</button>
        <button id="resetBtn" class="danger">Reset</button>
    </div>

    <div id="status" class="status">Готов</div>

    <div class="meta">
        <div><b>Игра завершена:</b> <span id="endedValue">—</span></div>
        <div><b>Победитель:</b> <span id="winnerValue">—</span></div>
    </div>
</div>

<div class="card">
    <h2 style="margin-top:0;">Поле</h2>
    <div id="board" class="board"></div>
</div>

<div class="card">
    <h2 style="margin-top:0;">Ответ сервера</h2>
    <pre id="response">{}</pre>
</div>

<script>
    const apiBaseEl = document.getElementById('apiBase');
    const gameIdEl = document.getElementById('gameId');
    const statusEl = document.getElementById('status');
    const responseEl = document.getElementById('response');
    const boardEl = document.getElementById('board');
    const endedValueEl = document.getElementById('endedValue');
    const winnerValueEl = document.getElementById('winnerValue');

    const createBtn = document.getElementById('createBtn');
    const loadBtn = document.getElementById('loadBtn');
    const resetBtn = document.getElementById('resetBtn');

    let board = emptyBoard();
    let busy = false;

    function emptyBoard() {
        return Array.from({ length: 3 }, () => Array(3).fill(-1));
    }

    function cloneBoard(b) {
        return b.map(row => row.slice());
    }

    function symbol(v) {
        if (v === 0) return 'X';
        if (v === 1) return 'O';
        return '';
    }

    function winnerText(v) {
        if (v === 0) return 'X';
        if (v === 1) return 'O';
        if (v === -1) return 'Ничья';
        return '—';
    }

    function setStatus(text) {
        statusEl.textContent = text;
    }

    function apiBase() {
        return apiBaseEl.value.trim().replace(/\/$/, '');
    }

    function extractBoard(data) {
        if (Array.isArray(data)) return data;
        if (data && Array.isArray(data.board)) return data.board;
        if (data && Array.isArray(data.Board)) return data.Board;
        return null;
    }

    function extractEnded(data) {
        if (!data || typeof data !== 'object') return null;
        if (typeof data.GameIsEnded === 'boolean') return data.GameIsEnded;
        if (typeof data.gameIsEnded === 'boolean') return data.gameIsEnded;
        return null;
    }

    function extractWinner(data) {
        if (!data || typeof data !== 'object') return null;
        if (typeof data.HowIsWinner === 'number') return data.HowIsWinner;
        if (typeof data.howIsWinner === 'number') return data.howIsWinner;
        return null;
    }

    function renderMeta(data) {
        const ended = extractEnded(data);
        const winner = extractWinner(data);

        endedValueEl.textContent = ended === null ? '—' : (ended ? 'Да' : 'Нет');
        winnerValueEl.textContent = winner === null ? '—' : winnerText(winner);
    }

    function renderBoard() {
        boardEl.innerHTML = '';
        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                const btn = document.createElement('button');
                btn.className = 'cell';
                btn.textContent = symbol(board[i][j]);
                btn.disabled = busy || board[i][j] !== -1;
                btn.addEventListener('click', () => makeMove(i, j));
                boardEl.appendChild(btn);
            }
        }
    }

    function updateBoard(newBoard) {
        board = cloneBoard(newBoard);
        renderBoard();
    }

    function applyServerResponse(data) {
        responseEl.textContent = JSON.stringify(data, null, 2);
        renderMeta(data);

        const b = extractBoard(data);
        if (b) updateBoard(b);
    }

    async function createGame() {
        try {
            const res = await fetch(`${apiBase()}/create`);
            const data = await res.json();
            applyServerResponse(data);

            if (!res.ok) {
                setStatus(`Ошибка create: ${res.status}`);
                return;
            }

            gameIdEl.value = data.id || data.Id || '';
            setStatus('Игра создана');
        } catch (e) {
            setStatus('Ошибка create');
            responseEl.textContent = String(e);
        }
    }

    async function loadGame() {
        const id = gameIdEl.value.trim();
        if (!id) {
            setStatus('Введите UUID');
            return;
        }

        try {
            const res = await fetch(`${apiBase()}/get/${id}`);
            const data = await res.json();
            applyServerResponse(data);

            if (!res.ok) {
                setStatus(`Ошибка load: ${res.status}`);
                return;
            }

            setStatus('Игра загружена');
        } catch (e) {
            setStatus('Ошибка load');
            responseEl.textContent = String(e);
        }
    }

    async function makeMove(x, y) {
        const id = gameIdEl.value.trim();
        if (!id) {
            setStatus('Сначала создайте игру');
            return;
        }
        if (busy || board[x][y] !== -1) return;

        const nextBoard = cloneBoard(board);
        nextBoard[x][y] = 0;

        busy = true;
        renderBoard();
        setStatus('Отправляю ход...');

        try {
            const res = await fetch(`${apiBase()}/game/${id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ board: nextBoard })
            });

            const data = await res.json();
            applyServerResponse(data);

            if (!res.ok) {
                setStatus(`Ошибка move: ${res.status}`);
                return;
            }

            setStatus('Ход принят');
        } catch (e) {
            setStatus('Ошибка move');
            responseEl.textContent = String(e);
        } finally {
            busy = false;
            renderBoard();
        }
    }

    function resetLocal() {
        board = emptyBoard();
        renderBoard();
        responseEl.textContent = '{}';
        endedValueEl.textContent = '—';
        winnerValueEl.textContent = '—';
        setStatus('Локальная доска сброшена');
    }

    createBtn.addEventListener('click', createGame);
    loadBtn.addEventListener('click', loadGame);
    resetBtn.addEventListener('click', resetLocal);

    renderBoard();
</script>
</body>
</html>
